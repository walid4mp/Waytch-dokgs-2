# =====================================================================
#  Neon Cipher — CI/CD Pipeline
#  Tests (Edit Mode) + Windows64 + Android Debug APK + Android Release AAB
#  =====================================================================
name: Neon Cipher CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_NAME: NeonCipher
  UNITY_VERSION: 2022.3.20f1

jobs:
  ############################################################
  # 1. Edit Mode unit tests (unity-test-runner)
  ############################################################
  test-editmode:
    name: Edit Mode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Run Edit Mode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results
          customParameters: -nographics -batchmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Edit Mode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-editmode
          path: test-results

  ############################################################
  # 2. Windows 64 standalone build
  ############################################################
  build-windows:
    name: Standalone Windows64
    runs-on: ubuntu-latest
    needs: test-editmode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Build Windows64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.PROJECT_NAME }}-Windows64
          buildsPath: build
          customParameters: -nographics -batchmode

      - name: Upload Windows64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonCipher-Windows64
          path: build/StandaloneWindows64

  ############################################################
  # 3. Android Debug APK
  ############################################################
  build-android-debug-apk:
    name: Android Debug (APK)
    runs-on: ubuntu-latest
    needs: test-editmode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Build Android Debug APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.PROJECT_NAME }}-Android-Debug
          buildsPath: build
          androidExportType: androidPackage
          customParameters: -nographics -batchmode

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCipher-Android-Debug-Apk
          path: build/Android

  ############################################################
  # 4. Android Release AAB (Google Play-ready, signed via secrets)
  ############################################################
  build-android-release-aab:
    name: Android Release (AAB / Play)
    runs-on: ubuntu-latest
    needs: test-editmode
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Build Android Release AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.PROJECT_NAME }}-Android-Release
          buildsPath: build
          androidExportType: androidAppBundle
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          customParameters: -nographics -batchmode

      - name: Upload Android Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NeonCipher-Android-Release-Aab
          path: build/Android

  ############################################################
  # 5. GitHub Release on tag v*
  ############################################################
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android-debug-apk, build-android-release-aab]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NeonCipher-Windows64/**/*
            artifacts/NeonCipher-Android-Debug-Apk/**/*
            artifacts/NeonCipher-Android-Release-Aab/**/*
          generate_release_notes: true
