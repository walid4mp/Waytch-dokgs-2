# =====================================================================
#  Neon Cipher — CI/CD Pipeline
#  Builds Linux tests, Android Debug/Apk, Android Release/Aab, Windows64
#  =====================================================================
name: Neon Cipher CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_NAME: NeonCipher
  UNITY_VERSION: 2022.3.20f1
  BUILD_TARGETS: StandaloneWindows64;Android

jobs:
  ############################################################
  # 1. Edit-mode + Play-mode unit tests
  ############################################################
  test:
    name: Unit Tests (Edit + Play Mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true, submodules: recursive }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Test
          testMode: editmode
          artifactsPath: artifacts/test
          customParameters: -nographics -batchmode
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test

  ############################################################
  # 2. Windows 64 standalone build
  ############################################################
  build-windows:
    name: Standalone Windows64
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true, submodules: recursive }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.PROJECT_NAME }}-Windows64
          artifactsPath: artifacts/windows64
      - uses: actions/upload-artifact@v4
        with:
          name: NeonCipher-Windows64
          path: artifacts/windows64

  ############################################################
  # 3. Android Debug APK
  ############################################################
  build-android-debug-apk:
    name: Android Debug (APK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true, submodules: recursive }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.PROJECT_NAME }}-Android-Debug
          artifactsPath: artifacts/android-debug
          customParameters: -developmentBuild
      - uses: actions/upload-artifact@v4
        with:
          name: NeonCipher-Android-Debug-Apk
          path: artifacts/android-debug

  ############################################################
  # 4. Android Release AAB (Google Play-ready)
  ############################################################
  build-android-release-aab:
    name: Android Release (AAB / Play)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true, submodules: recursive }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_NAME:    neoncipher.jks
          ANDROID_KEYSTORE_PASS:    ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME:    ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS:    ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.PROJECT_NAME }}-Android-Release
          artifactsPath: artifacts/android-release
          customParameters: -buildAppBundle
      - uses: actions/upload-artifact@v4
        with:
          name: NeonCipher-Android-Release-Aab
          path: artifacts/android-release

  ############################################################
  # 5. GitHub Release on tag v*
  ############################################################
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android-debug-apk, build-android-release-aab]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            NeonCipher-Windows64/**/*
            NeonCipher-Android-Debug-Apk/**/*
            NeonCipher-Android-Release-Aab/**/*
          generate_release_notes: true
